    <div id="zoneOk">
      <h1>Réinitialisation du mot de passe</h1>
      <p>Vous allez être redirigé vers l'application. Si rien ne se passe, touchez le bouton ci-dessous.</p>
      <a id="lienApp" class="bouton" href="#">Ouvrir Vellu</a>

    <div id="zoneErr">
      <h1 class="err">Lien invalide</h1>
      <p>Ce lien de réinitialisation est incomplet. Redemandez un lien depuis l'application Vellu.</p>
    </div>

  <script>
    // 100% statique : lit uniquement le token_hash de l'URL et construit le deep
    // link de l'app. Le token_hash n'est ni affiché, ni journalisé, ni envoyé
    // ailleurs. Pas de fonction wrapper ni de return : robuste au copier-coller.
    var params = new URLSearchParams(window.location.search);
    var tokenHash = params.get('token_hash');
    var type = params.get('type') || 'recovery';
    if (tokenHash) {
      var deep = 'vellu://reset-password?' +
        new URLSearchParams({ token_hash: tokenHash, type: type }).toString();
      document.getElementById('lienApp').href = deep;
      document.getElementById('zoneOk').style.display = 'block';
      window.location.replace(deep);
    } else {
      document.getElementById('zoneErr').style.display = 'block';
    }
  </script>
